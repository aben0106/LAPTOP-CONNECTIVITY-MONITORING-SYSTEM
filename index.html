<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Laptop Monitoring</title>
  <!-- Fonts: DM Sans (interface text) and JetBrains Mono (technical data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #e9ebef;
      font-family: "DM Sans", "Segoe UI", Arial, sans-serif;
      color: #1f2933;
    }
    /* text boxes and buttons do not copy the page font by themselves */
    input, button { font-family: inherit; }

    /* ---------- The big white card: picture on the left, form on the right ---------- */
    .login-card {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 32px;
      width: 100%;
      max-width: 1100px;
      /* the card always fits inside the browser window, so there is no scroll bar */
      height: calc(100vh - 48px);   /* 48px = the space around the card */
      max-height: 680px;            /* do not get too tall on big screens */
      padding: 28px;
      background: #ffffff;
      border-radius: 36px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
    }

    /* ---------- Left: campus picture ---------- */
    .photo {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: #d9dde3;   /* shows while the picture loads */
    }
    /* ---------- Photo slideshow ---------- */
    /* every photo sits on top of the others; only the "active" one is shown */
    .slide {
      position: absolute;
      inset: 0;
      overflow: hidden;
      opacity: 0;
      transition:
        transform 0.8s cubic-bezier(0.77, 0, 0.18, 1),   /* fast in the middle, soft at the ends */
        opacity 0.8s ease,
        filter 0.8s ease;
    }
    .slide.active { opacity: 1; }
    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;     /* fills the box without stretching */
      display: block;
    }
    /* the photo on screen slowly zooms in, like a documentary camera */
    .slide.active img { animation: slow-zoom 7s ease-out forwards; }
    @keyframes slow-zoom {
      from { transform: scale(1.12); }
      to   { transform: scale(1); }
    }

    /* dark fade at the bottom so the caption is readable */
    .photo::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0) 50%);
    }
    .photo-caption {
      position: absolute;
      left: 28px;
      right: 28px;
      bottom: 52px;          /* leaves room for the dots underneath */
      z-index: 2;
      color: #ffffff;
    }

    /* ---------- Prev / Next arrows ---------- */
    .slide-btn {
      position: absolute;
      top: 50%;
      z-index: 3;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);   /* frosted glass look */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #ffffff;
      cursor: pointer;
      transform: translateY(-50%);
      transition: background 0.2s, transform 0.2s;
    }
    .slide-btn:hover  { background: rgba(255, 255, 255, 0.35); transform: translateY(-50%) scale(1.08); }
    .slide-btn:active { transform: translateY(-50%) scale(0.94); }
    .slide-btn svg { width: 22px; height: 22px; }
    .slide-btn.prev { left: 18px; }
    .slide-btn.next { right: 18px; }

    /* ---------- The three small circles ---------- */
    .dots {
      position: absolute;
      left: 50%;
      bottom: 20px;
      z-index: 3;
      display: flex;
      gap: 8px;
      transform: translateX(-50%);
    }
    .dot {
      width: 9px;
      height: 9px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: width 0.4s ease, background 0.4s ease, transform 0.4s ease, opacity 0.4s ease;
    }
    .dot:hover { background: rgba(255, 255, 255, 0.8); }
    /* the circle for the photo on screen stretches into a little bar */
    .dot.active { width: 26px; background: #ffffff; }
    /* only 5 circles are shown at a time; the rest are hidden */
    .dot.hidden { display: none; }
    /* a smaller circle at the edge means "there are more photos this way" */
    .dot.edge { transform: scale(0.6); opacity: 0.7; }

    /* people who turn off animations in Windows get a simple fade only */
    @media (prefers-reduced-motion: reduce) {
      .slide { transition: opacity 0.3s; }
      .slide.active img { animation: none; }
    }
    .photo-caption strong { display: block; font-size: 22px; font-weight: 700; }
    .photo-caption span { font-size: 14px; opacity: 0.9; }

    /* ---------- Right: the form ---------- */
    .form-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 36px;
    }
    .form-inner { width: 100%; max-width: 360px; margin: 0 auto; }

    .logo {
      display: block;
      width: 84px;           /* change this number to make the logo bigger or smaller */
      height: auto;
      margin: 0 auto 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
    }
    p.sub {
      margin: 0 0 36px;
      color: #7b8794;
      font-size: 14px;
      text-align: center;
    }

    /* text boxes with only a line underneath, like the template */
    .field { margin-bottom: 26px; }
    .field label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      color: #7b8794;
    }
    .field-row { position: relative; }
    .field input {
      width: 100%;
      padding: 11px 42px 11px 12px;   /* room on the right for the eye button */
      border: 1.5px solid #cbd2d9;
      border-radius: 6px;             /* very small curve on every corner */
      background: #ffffff;
      font-size: 15px;
      color: #1f2933;
      outline: none;
    }
    .field input:focus { border-color: #1f2933; }

    /* the eye button to show / hide the password (sits inside the box, on the right) */
    .eye-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      padding: 4px;
      border: none;
      background: none;
      color: #52606d;
      cursor: pointer;
    }
    .eye-btn:hover { color: #1f2933; }
    .eye-btn svg { width: 100%; height: 100%; display: block; }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: -8px 0 28px;
      font-size: 13px;
      color: #52606d;
      cursor: pointer;
      user-select: none;
    }
    .remember input { width: 15px; height: 15px; margin: 0; accent-color: #1f2933; cursor: pointer; }

    #loginBtn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 999px;
      background: #1c1c1e;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #loginBtn:hover { background: #3a3a3c; }
    #loginBtn:disabled { background: #8e8e93; cursor: not-allowed; }

    #message {
      min-height: 20px;
      margin-top: 16px;
      font-size: 14px;
      color: #c0392b;
      text-align: center;
    }

    .footer-note {
      margin-top: 28px;
      font-size: 12px;
      color: #9aa5b1;
      text-align: center;
    }

    /* ---------- Short windows (e.g. a 1366 x 768 laptop): tighten the spacing ---------- */
    @media (max-height: 740px) {
      .login-card { padding: 20px; }
      .form-side { padding: 8px 28px; }
      .logo { width: 64px; margin-bottom: 12px; }
      h1 { font-size: 24px; }
      p.sub { margin-bottom: 24px; }
      .field { margin-bottom: 18px; }
      .remember { margin-bottom: 20px; }
      #loginBtn { padding: 13px; }
      #message { margin-top: 10px; }
      .footer-note { margin-top: 12px; }
    }

    /* ---------- Small screens: picture on top, form below ---------- */
    @media (max-width: 820px) {
      body { padding: 16px; }
      .login-card {
        grid-template-columns: 1fr;
        height: auto;        /* on phones the page may scroll, that is normal */
        max-height: none;
        padding: 16px;
        gap: 8px;
        border-radius: 28px;
      }
      .photo { height: 200px; }
      .form-side { padding: 20px 12px 12px; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <!-- Left: campus picture -->
    <div class="photo">
      <!-- the photos: add or remove a .slide line to change how many there are -->
      <div class="slide active"><img src="msumain1.jpg" alt="Mindanao State University Main Campus gate"></div>
      <div class="slide"><img src="msumain2.jpg" alt="Mindanao State University Main Campus"></div>
      <div class="slide"><img src="msumain3.jpg" alt="Mindanao State University Main Campus"></div>
      <div class="slide"><img src="msumain4.jpg" alt="Mindanao State University Main Campus"></div>
      <div class="slide"><img src="msumain5.jpg" alt="Mindanao State University Main Campus"></div>
      <div class="slide"><img src="msumain6.jpg" alt="Mindanao State University Main Campus"></div>
      <div class="slide"><img src="msumain7.jpg" alt="Mindanao State University Main Campus"></div>
      <div class="slide"><img src="msumain8.jpg" alt="Mindanao State University Main Campus"></div>
      <div class="slide"><img src="msumain9.jpg" alt="Mindanao State University Main Campus"></div>

      <button type="button" class="slide-btn prev" id="prevPhoto" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button type="button" class="slide-btn next" id="nextPhoto" aria-label="Next photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>

      <!-- the small circles are made by the script, one per photo -->
      <div class="dots" id="dots"></div>
      <div class="photo-caption">
        <strong>Mindanao State University</strong>
        <span>Main Campus, Marawi City</span>
      </div>
    </div>

    <!-- Right: login form -->
    <div class="form-side">
      <div class="form-inner">
        <img src="msu-logo.png" alt="Mindanao State University logo" class="logo">
        <h1>Laptop Connectivity Monitoring System</h1>
        <p class="sub">ICTC Office login</p>

        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <div class="field-row">
              <input type="email" id="email" autocomplete="username" required>
            </div>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="field-row">
              <input type="password" id="password" autocomplete="current-password" required>
              <button type="button" class="eye-btn" id="eyeBtn" aria-label="Show password">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" id="eyeIcon">
                  <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <label class="remember">
            <input type="checkbox" id="remember" checked>
            Remember me
          </label>

          <button type="submit" id="loginBtn">Log in</button>
        </form>

        <div id="message"></div>

        <p class="footer-note">For authorized ICTC personnel only.</p>
      </div>
    </div>
  </div>

  <!-- ---------- Photo slideshow ---------- -->
  <script>
    (function () {
      // ---- SETTINGS ----
      const AUTO_PLAY_SECONDS = 6;   // moves to the next photo by itself; 0 = only with the arrows
      const ANIMATION_MS = 800;      // must match the 0.8s in the .slide CSS
      const MAX_DOTS = 5;            // how many small circles to show at once
      // ------------------

      const slides = Array.from(document.querySelectorAll(".slide"));
      const dotsBox = document.getElementById("dots");
      const photoBox = document.querySelector(".photo");
      let current = 0;
      let busy = false;     // ignore extra clicks while a photo is still sliding in
      let timer = null;

      // one small circle per photo
      const dots = slides.map((_, i) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "dot";
        dot.setAttribute("aria-label", "Show photo " + (i + 1));
        dot.addEventListener("click", () => {
          if (i !== current) goTo(i, i > current ? 1 : -1);
          restartTimer();
        });
        dotsBox.appendChild(dot);
        return dot;
      });

      // Show only MAX_DOTS circles, a "window" that follows the current photo.
      // Example with 9 photos on photo 6: circles for photos 4 5 [6] 7 8 are shown,
      // and the two outer ones are smaller because there are more photos beyond them.
      function updateDots() {
        const total = dots.length;
        const shown = Math.min(MAX_DOTS, total);
        let start = current - Math.floor(shown / 2);
        start = Math.max(0, Math.min(start, total - shown));
        const end = start + shown - 1;

        dots.forEach((dot, i) => {
          dot.classList.toggle("active", i === current);
          dot.classList.toggle("hidden", i < start || i > end);
          dot.classList.toggle("edge",
            (i === start && start > 0) || (i === end && end < total - 1));
        });
      }
      updateDots();

      // direction: 1 = next (comes in from the right), -1 = prev (comes in from the left)
      function goTo(next, direction) {
        if (busy || next === current) return;
        busy = true;

        const oldSlide = slides[current];
        const newSlide = slides[next];

        // 1. put the new photo just outside the box, slightly zoomed and blurred, with no animation
        newSlide.style.transition = "none";
        newSlide.style.transform = "translateX(" + (direction * 100) + "%) scale(1.08)";
        newSlide.style.filter = "blur(6px)";
        newSlide.style.zIndex = 1;
        oldSlide.style.zIndex = 0;
        void newSlide.offsetWidth;            // makes the browser apply the start position first

        // 2. animate: the new photo slides in and sharpens,
        //    the old one drifts the other way, shrinks and fades
        newSlide.style.transition = "";
        newSlide.classList.add("active");
        newSlide.style.transform = "translateX(0) scale(1)";
        newSlide.style.filter = "blur(0)";

        oldSlide.style.transform = "translateX(" + (-direction * 30) + "%) scale(0.92)";
        oldSlide.style.filter = "blur(4px)";
        oldSlide.classList.remove("active");

        current = next;
        updateDots();

        // 3. when the animation is over, reset the old photo so it is ready for next time
        setTimeout(() => {
          oldSlide.style.transition = "none";
          oldSlide.style.transform = "";
          oldSlide.style.filter = "";
          busy = false;
        }, ANIMATION_MS);
      }

      function nextPhoto() { goTo((current + 1) % slides.length, 1); }
      function prevPhoto() { goTo((current - 1 + slides.length) % slides.length, -1); }

      document.getElementById("nextPhoto").addEventListener("click", () => { nextPhoto(); restartTimer(); });
      document.getElementById("prevPhoto").addEventListener("click", () => { prevPhoto(); restartTimer(); });

      // ---- Auto play (pauses while the mouse is over the photo) ----
      function restartTimer() {
        clearInterval(timer);
        if (AUTO_PLAY_SECONDS > 0) timer = setInterval(nextPhoto, AUTO_PLAY_SECONDS * 1000);
      }
      photoBox.addEventListener("mouseenter", () => clearInterval(timer));
      photoBox.addEventListener("mouseleave", restartTimer);
      restartTimer();

      // ---- Swipe left / right on phones ----
      let touchStartX = null;
      photoBox.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
      photoBox.addEventListener("touchend", (e) => {
        if (touchStartX === null) return;
        const moved = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(moved) > 40) { moved < 0 ? nextPhoto() : prevPhoto(); restartTimer(); }
        touchStartX = null;
      });
    })();
  </script>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      onAuthStateChanged,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginBtn");
    const passwordEl = document.getElementById("password");
    const eyeBtn = document.getElementById("eyeBtn");
    const eyeIcon = document.getElementById("eyeIcon");

    // Eye button: show or hide the password
    const EYE_OPEN = '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
    const EYE_CLOSED = '<path d="M3 3l18 18"/><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.1 3.9"/>' +
                       '<path d="M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
    eyeBtn.addEventListener("click", () => {
      const showing = passwordEl.type === "text";
      passwordEl.type = showing ? "password" : "text";
      eyeIcon.innerHTML = showing ? EYE_OPEN : EYE_CLOSED;
      eyeBtn.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "dashboard.html";
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Logging in...";

      const email = document.getElementById("email").value.trim();
      const password = passwordEl.value;

      try {
        // Remember me ticked   = stay logged in after closing the browser
        // Remember me unticked = logged out when the browser is closed
        const remember = document.getElementById("remember").checked;
        await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);

        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "dashboard.html";
      } catch (error) {
        console.error(error);
        if (error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password" ||
            error.code === "auth/user-not-found") {
          message.textContent = "Wrong email or password.";
        } else if (error.code === "auth/too-many-requests") {
          message.textContent = "Too many attempts. Please wait a few minutes and try again.";
        } else if (error.code === "auth/network-request-failed") {
          message.textContent = "No internet connection.";
        } else {
          message.textContent = "Login failed: " + error.code;
        }
        button.disabled = false;
        button.textContent = "Log in";
      }
    });
  </script>
</body>
</html>
