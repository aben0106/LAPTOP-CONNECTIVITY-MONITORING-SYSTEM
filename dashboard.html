<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Laptop Monitoring</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f1f4f8;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #1f2933;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: #ffffff;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.08);
    }
    header h1 { margin: 0; font-size: 18px; }
    .user { display: flex; align-items: center; gap: 12px; font-size: 14px; }
    .badge {
      padding: 3px 10px;
      border-radius: 999px;
      background: #dbe7ff;
      color: #1b4fc4;
      font-size: 12px;
      font-weight: 600;
    }
    button {
      padding: 8px 14px;
      border: 1px solid #cbd2d9;
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
      font-size: 14px;
    }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .panel {
      padding: 24px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }
    #status { color: #52606d; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <header>
    <h1>Laptop Connectivity Monitoring</h1>
    <div class="user">
      <span id="userName"></span>
      <span class="badge" id="userRole" hidden></span>
      <button id="logoutBtn">Log out</button>
    </div>
  </header>

  <main>
    <div class="panel">
      <p id="status">Checking your account...</p>
    </div>
  </main>

  <script type="module">
    import { auth, db } from "./firebase-config.js";
    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { ref, get } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

    const statusEl = document.getElementById("status");
    const nameEl = document.getElementById("userName");
    const roleEl = document.getElementById("userRole");

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "index.html";
    });

    async function readOrNull(path) {
      try {
        const snapshot = await get(ref(db, path));
        return snapshot.exists() ? snapshot.val() : null;
      } catch (error) {
        return null;
      }
    }

    async function getRole(uid) {
      const adminData = await readOrNull("admin/" + uid);
      if (adminData) {
        return { role: "Admin", name: adminData.username };
      }
      const staffData = await readOrNull("staff/" + uid);
      if (staffData) {
        return { role: "Staff", name: staffData.firstname };
      }
      return null;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      const info = await getRole(user.uid);

      if (!info) {
        statusEl.textContent = "Your account has no role in the system yet. Please ask the admin to add you.";
        statusEl.className = "error";
        nameEl.textContent = user.email;
        return;
      }

      nameEl.textContent = info.name;
      roleEl.textContent = info.role;
      roleEl.hidden = false;
      statusEl.textContent = "Logged in as " + info.role + ". The laptop list and search bar come next.";
    });
  </script>
</body>
</html>
